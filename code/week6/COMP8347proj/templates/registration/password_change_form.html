{% extends "classroom/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page">
  <h1>Change Password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update password</button>
  </form>
  <p class="muted">After you submit, you’ll be redirected to a confirmation page.</p>
</div>
{% endblock %}
