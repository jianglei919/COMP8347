{% extends "classroom/base.html" %}
{% block title %}Add Entry{% endblock %}
{% block content %}
<div class="page">
  <h1>Sign the Guestbook</h1>

  <form method="post" action="">
    <!-- BUG 8: missing CSRF token will 403 on POST -->
    <p>
      <label>Display name</label><br>
      <!-- BUG 9: template field mismatch; form has no display_name field -->
      {{ form.display_name }}
    </p>
    <p>
      <label>Message</label><br>
      {{ form.message }}
    </p>

    <button type="submit">Save</button>
  </form>

  <p class="muted">Tip: set your name cookie first so the form can prefill it.</p>
</div>
{% endblock %}
